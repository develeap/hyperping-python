name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # TODO H11: pin to full 40-char commit SHA
      - uses: actions/checkout@v4
      # TODO H11: pin to full 40-char commit SHA
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      # L5: audit before publishing
      - name: Audit dependencies
        run: uv run pip-audit || uv audit || true
      - run: uv run pytest                    # gate — no publish on red tests
      - run: uv build
      # TODO H11: pin to full 40-char commit SHA
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish-testpypi:
    needs: [build]
    if: "github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hyperping
    permissions:
      id-token: write
    steps:
      # TODO H11: pin to full 40-char commit SHA
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      # TODO H11: pin to full 40-char commit SHA
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build]
    if: "github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hyperping
    permissions:
      id-token: write
    steps:
      # TODO H11: pin to full 40-char commit SHA
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      # TODO H11: pin to full 40-char commit SHA
      - uses: pypa/gh-action-pypi-publish@release/v1
