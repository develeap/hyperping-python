[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hyperping"
version = "1.0.0"
description = "Python SDK for the Hyperping uptime monitoring and incident management API"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{ name = "Develeap", email = "khaled.salhab@develeap.com" }]
keywords = ["hyperping", "monitoring", "uptime", "status-page", "incident", "api-client", "sdk", "python", "pydantic", "httpx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pydantic",
    "pip-audit>=2.7",
]

[project.urls]
Homepage      = "https://github.com/develeap/hyperping-python"
Documentation = "https://github.com/develeap/hyperping-python#readme"
Repository    = "https://github.com/develeap/hyperping-python"
Changelog     = "https://github.com/develeap/hyperping-python/blob/main/CHANGELOG.md"
Issues        = "https://github.com/develeap/hyperping-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperping"]

[tool.hatch.build.targets.sdist]
exclude = [".claude/", ".github/", "dist/", "uv.lock", "BACKLOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hyperping --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
